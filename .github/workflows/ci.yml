name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Types, lint, dependency rules, contract examples and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
    steps:
      - name: Check out the repository (actions/checkout v7.0.1)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install the Java and Node versions pinned in .mise.toml (jdx/mise-action v5.2.8)
        uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785
        with:
          version: 2026.11.3
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run depcruise
      - run: npm run check:contract
      - run: npm test

  tlc:
    uses: ./.github/workflows/tlc.yml
