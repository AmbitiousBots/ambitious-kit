name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-check:
    name: Every check a kit release must pass
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
    steps:
      - name: Check out the repository (actions/checkout v7.0.1)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install the Java, Node and Python versions pinned in .mise.toml (jdx/mise-action v5.3.0)
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78
        with:
          version: 2026.11.12
      - run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - run: npm install --strict-peer-deps
      - run: git diff --exit-code -- package-lock.json
      - run: npm ls --all
      - run: npm ci --strict-peer-deps
      - run: npm ls --all
      - run: npm run release:check

  tlc:
    uses: ./.github/workflows/tlc.yml
